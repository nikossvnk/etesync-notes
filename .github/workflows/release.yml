name: Release

# Builds the Android app and publishes it as a GitHub release when a version tag is pushed:
#   git tag v1.8.0 && git push origin v1.8.0
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64   the release keystore, encoded with: base64 -w0 release.jks
#   RELEASE_STORE_PASSWORD    the password of the keystore
#   RELEASE_KEY_ALIAS         the alias of the key in the keystore
#   RELEASE_KEY_PASSWORD      the password of the key

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  android:
    runs-on: ubuntu-latest
    # A build takes around half an hour, don't keep going for hours when it hangs
    timeout-minutes: 90
    permissions:
      # To create the release
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the release key is configured
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # Without it the app would be signed with the public debug key, which must never be released
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set"
              exit 1
            fi
          done

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: npm ci

      - name: Unpack libsodium
        # Normally done by the install script of react-native-sodium, which npm may not run
        run: |
          if [ ! -d node_modules/react-native-sodium/libsodium ]; then
            tar -xzf node_modules/react-native-sodium/precompiled.tgz -C node_modules/react-native-sodium
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Write the release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # The version code comes from the version, so that it always grows (Android only installs an
          # update with a higher one): 1.9.0 is 10900. Releases up to 1.8.1 used the run number (at most 5).
          IFS=. read -r major minor patch <<< "${TAG#v}"
          if [ "$minor" -ge 100 ] || [ "$patch" -ge 100 ]; then
            echo "The version code can't be made from $TAG" >&2
            exit 1
          fi
          versionCode=$(( major * 10000 + minor * 100 + patch ))
          echo "Version code: $versionCode"
          ./gradlew assembleRelease --no-daemon \
            -PreleaseStoreFile="$RUNNER_TEMP/release.jks" \
            -PappVersionName="${TAG#v}" \
            -PappVersionCode="$versionCode" \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -PsplitApksPerAbi=true

      - name: Remove the release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check that the app is not signed with the debug key
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for abi in arm64-v8a armeabi-v7a; do
            "$apksigner" verify --print-certs "android/app/build/outputs/apk/release/app-$abi-release.apk" | tee certs.txt
            if grep -q "CN=Android Debug" certs.txt; then
              echo "::error::The $abi app is signed with the debug key"
              exit 1
            fi
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One APK per CPU architecture: the one without a suffix is for 64-bit phones (nearly all of
          # them), the armeabi-v7a one for older 32-bit phones
          out=android/app/build/outputs/apk/release
          apk="etesync-notes-${TAG#v}.apk"
          apk32="etesync-notes-${TAG#v}-armeabi-v7a.apk"
          cp "$out/app-arm64-v8a-release.apk" "$apk"
          cp "$out/app-armeabi-v7a-release.apk" "$apk32"
          sha256sum "$apk" > "$apk.sha256"
          sha256sum "$apk32" > "$apk32.sha256"
          gh release create "$TAG" "$apk" "$apk.sha256" "$apk32" "$apk32.sha256" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
